name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/   # rules configured in backend/ruff.toml

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          DEBUG: "False"
          APP_ENV: "development"
          SECRET_KEY: "test-secret-key-for-ci"
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security-scan:
    # Dependency + static security scanning (ELR-028). Report-only for now
    # (continue-on-error) so findings surface on every PR without blocking on
    # pre-existing transitive CVEs; flip to blocking once the backlog is cleared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (dependency CVEs)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: bandit (Python SAST)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r backend/app -ll -x backend/app/tests

      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npx jest --coverage --ci

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npm run build
