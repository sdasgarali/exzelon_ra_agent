# Ruff configuration for the backend.
#
# CI runs `ruff check app/` and relies on this file (keep the two in sync).
line-length = 120

[lint]
select = ["E", "W", "F"]
# Ignored rule rationale:
#   E501 — line length is enforced softly (line-length=120) but not failed on.
#   E402 — several app modules do intentional late/conditional imports
#          (settings-gated adapters, sys.path setup) that this rule flags.
#   E711/E712 — `== None` / `== True` / `== False` are REQUIRED SQLAlchemy
#          filter idioms (they compile to SQL); rewriting to `is` breaks queries.
#   E741 — single-letter loop/lambda vars (l, I, O) are pervasive and low-risk.
ignore = ["E501", "E402", "E711", "E712", "E741"]

[lint.per-file-ignores]
# Aggregator modules import names purely for re-export / SQLAlchemy model
# registration side effects; those are "unused" to F401 but essential.
"**/__init__.py" = ["F401"]
"app/db/base.py" = ["F401"]
