# Nginx reverse proxy for RA Cold-Email Automation
# Usage:
#   1. Copy to /etc/nginx/sites-available/ra-app
#   2. ln -s /etc/nginx/sites-available/ra-app /etc/nginx/sites-enabled/
#   3. Replace YOUR_DOMAIN with your actual domain
#   4. Run: sudo certbot --nginx -d YOUR_DOMAIN (for SSL)
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream api_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream web_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL - managed by Certbot (uncomment after running certbot)
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers are owned by the apps, not nginx: the API sets them in
    # backend/app/middleware/security_headers.py (X-Frame-Options DENY, CSP, HSTS
    # when X-Forwarded-Proto is https) and the web app in frontend/next.config.js.
    # Adding them here as well sent every header twice (and "DENY, SAMEORIGIN" on
    # the API), so every proxied location must pass X-Forwarded-Proto instead.

    # Request limits
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # API backend
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # Tracking endpoints (pixel + link)
    location /t/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unsubscribe endpoint (server-rendered HTML from backend)
    location /unsub/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Always revalidate the HTML shell / app responses so a new deploy is picked
        # up without a hard refresh. Hashed assets under /_next/static/ (separate
        # block below) stay immutable, so this costs only a small conditional GET.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # Static file caching
    location /_next/static/ {
        proxy_pass http://web_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
