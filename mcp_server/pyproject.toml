[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neuraleads-mcp"
version = "0.1.0"
description = "MCP connector for NeuraLeads: lets AI tools manage mailboxes, lead sourcing, enrichment, validation, campaigns, warmup and inbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
neuraleads-mcp = "neuraleads_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuraleads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: fast, no network", "integration: drives the real FastAPI app in-process"]
